<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT ACCESS: Hardware Control Center</title>
    <style>
        body {
            background-color: #08080a;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            transition: filter 0.1s ease;
        }

        .dashboard {
            width: 100%;
            max-width: 500px;
            background: #11141a;
            border: 1px solid #00ffcc;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
            box-sizing: border-box;
        }

        .header {
            border-bottom: 1px solid #222d3d;
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffcc;
        }

        .status-badge {
            display: inline-block;
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 8px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-control {
            background: #181d26;
            border: 1px solid #00ffcc44;
            color: #fff;
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-control:active {
            transform: scale(0.96);
            background: #00ffcc;
            color: #000;
        }

        .btn-control.danger {
            border-color: #ff336644;
            color: #ff3366;
        }

        .btn-control.danger:active {
            background: #ff3366;
            color: #fff;
        }

        .btn-icon {
            font-size: 20px;
        }

        .console-box {
            background: #090b0e;
            border: 1px solid #1f2937;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            color: #a0aec0;
            height: 100px;
            overflow-y: auto;
            word-break: break-all;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-success { color: #00ffcc; }
        .log-warn { color: #ffcc00; }
        .log-danger { color: #ff3366; }

        /* Invert Screen Glitch */
        .inverted {
            filter: invert(100%) hue-rotate(180deg) !important;
        }

        /* Flash Screen Glitch */
        .flash-white {
            background-color: #ffffff !important;
        }
    </style>
</head>
<body>

    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>Hardware Control Center</h1>
            <div class="status-badge" id="connStatus">● SESSION CONNECTED: LOCAL HOST</div>
        </div>

        <div class="control-grid">
            <button class="btn-control" onclick="triggerHardware('flash')">
                <span class="btn-icon">⚡</span>
                <span>Toggle Flashlight</span>
            </button>

            <button class="btn-control" onclick="triggerHardware('haptic')">
                <span class="btn-icon">📳</span>
                <span>Overload Haptics</span>
            </button>

            <button class="btn-control" onclick="triggerHardware('camera')">
                <span class="btn-icon">📸</span>
                <span>Mount Sensor</span>
            </button>

            <button class="btn-control" onclick="triggerHardware('glitch')">
                <span class="btn-icon">🖥️</span>
                <span>Invert GPU Color</span>
            </button>

            <button class="btn-control danger" style="grid-column: span 2;" onclick="triggerHardware('alarm')">
                <span class="btn-icon">🚨</span>
                <span>Trigger System Alarm</span>
            </button>
        </div>

        <div class="console-box" id="console">
            <div class="log-entry log-success">> Remote bridge active. System ready...</div>
        </div>
    </div>

    <script>
        // YOUR WEBHOOK URL
        const WEBHOOK_URL = "https://webhooksite.net/d5b8ad10-9401-461a-9519-d408d46ea101";

        // Web Audio Synthesizer
        function playTone(freq, type, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Webhook Logger
        function logActionToWebhook(actionName) {
            try {
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        buttonPressed: actionName,
                        timestamp: new Date().toLocaleTimeString(),
                        userAgent: navigator.userAgent
                    })
                });
            } catch(e) {}
        }

        function appendLog(msg, type = '') {
            const consoleBox = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `> ${msg}`;
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // Hardware Controls Trigger
        function triggerHardware(type) {
            const body = document.body;

            if (type === 'flash') {
                logActionToWebhook("Toggle Flashlight");
                appendLog("Executing strobe pulse on LED array...", "log-warn");
                playTone(1200, 'square', 0.1);
                
                body.classList.add('flash-white');
                setTimeout(() => body.classList.remove('flash-white'), 150);

            } else if (type === 'haptic') {
                logActionToWebhook("Overload Haptics");
                appendLog("Sending forced frequency pulse to vibration motor...", "log-warn");
                playTone(150, 'sawtooth', 0.4);
                
                // Triggers physical phone vibration if supported
                if ("vibrate" in navigator) {
                    navigator.vibrate([200, 100, 200, 100, 400]);
                }

            } else if (type === 'camera') {
                logActionToWebhook("Mount Camera Sensor");
                appendLog("Initializing CMOS optical sensor buffer...", "log-warn");
                playTone(800, 'sine', 0.15);
                setTimeout(() => playTone(1600, 'sine', 0.2), 100);
                setTimeout(() => appendLog("ERROR: Access denied by Kernel Security Layer", "log-danger"), 600);

            } else if (type === 'glitch') {
                logActionToWebhook("Invert GPU Color");
                appendLog("Overriding GPU display buffer color matrix...", "log-warn");
                playTone(300, 'sawtooth', 0.3);
                
                body.classList.toggle('inverted');

            } else if (type === 'alarm') {
                logActionToWebhook("Trigger Alarm");
                appendLog("CRITICAL: Executing emergency siren protocol!", "log-danger");
                
                // Sirens sound
                playTone(900, 'sawtooth', 0.3);
                setTimeout(() => playTone(500, 'sawtooth', 0.3), 300);
                setTimeout(() => playTone(900, 'sawtooth', 0.3), 600);
                
                if ("vibrate" in navigator) {
                    navigator.vibrate([300, 100, 300, 100, 500]);
                }
            }
        }
    </script>
</body>
</html>
