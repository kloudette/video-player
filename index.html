<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT ACCESS: Hardware Control Center</title>
    <style>
        body {
            background-color: #08080a;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            overflow-x: hidden;
        }

        .dashboard {
            width: 100%;
            max-width: 500px;
            background: #11141a;
            border: 1px solid #00ffcc;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
            box-sizing: border-box;
            position: relative;
        }

        .header {
            border-bottom: 1px solid #222d3d;
            padding-bottom: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffcc;
        }

        /* Camera Scanner Box */
        .scanner-container {
            background: #000;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            position: relative;
            height: 220px;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(-1); /* Mirror view */
        }

        /* Reticle Overlay */
        .scanner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(0, 255, 204, 0.3);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
        }

        .reticle {
            width: 120px;
            height: 120px;
            border: 2px dashed #00ffcc;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: spin 8s linear infinite;
        }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .scan-line {
            width: 100%;
            height: 2px;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            position: absolute;
            top: 0;
            animation: scan 2s linear infinite;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .placeholder-text {
            color: #8a99ad;
            font-family: monospace;
            font-size: 12px;
            text-align: center;
        }

        .countdown-text {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366;
            display: none;
        }

        /* Control Grid */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-control {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-control:active {
            transform: scale(0.97);
            background: #00ffcc;
            color: #000;
        }

        .console-box {
            background: #090b0e;
            border: 1px solid #1f2937;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #a0aec0;
            height: 90px;
            overflow-y: auto;
            word-break: break-all;
        }

        .log-entry { margin-bottom: 4px; }
        .log-success { color: #00ffcc; }
        .log-warn { color: #ffcc00; }
        .log-danger { color: #ff3366; }

        .flash-white { background-color: #ffffff !important; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>Hardware Control Center</h1>
            <div style="font-size: 11px; color: #00ffcc; margin-top: 5px;">● OPTICAL SENSOR BRIDGE</div>
        </div>

        <!-- Camera Scanner Viewfinder -->
        <div class="scanner-container" id="scannerContainer">
            <video id="webcam" autoplay playsinline></video>
            
            <div class="scanner-overlay">
                <div style="font-family: monospace; font-size: 10px; color: #00ffcc;">[SENSOR: CMOS_FRONT_01]</div>
                <div style="font-family: monospace; font-size: 10px; color: #ff3366;" id="statusBadge">STANDBY</div>
            </div>

            <div class="reticle" id="reticle"></div>
            <div class="scan-line" id="scanLine"></div>
            <div class="placeholder-text" id="placeholder">AWAITING CAMERA AUTHORIZATION...</div>
            <div class="countdown-text" id="countdown">3</div>
        </div>

        <div class="control-grid">
            <button class="btn-control" id="scanBtn" onclick="startPhotoVerification()">
                <span>📸 Snap Reaction Photo (Verification)</span>
            </button>
        </div>

        <div class="console-box" id="console">
            <div class="log-entry log-success">> Optical stream initialized. Ready for verification...</div>
        </div>
    </div>

    <script>
        // WEBHOOK URL
        const WEBHOOK_URL = "https://webhook.site/5783ff51-5c26-4094-9165-70386acfae80";

        function playTone(freq, type, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function appendLog(msg, type = '') {
            const consoleBox = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `> ${msg}`;
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function logActionToWebhook(actionName) {
            try {
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event: actionName,
                        timestamp: new Date().toLocaleTimeString(),
                        userAgent: navigator.userAgent
                    })
                });
            } catch(e) {}
        }

        async function startPhotoVerification() {
            const video = document.getElementById('webcam');
            const placeholder = document.getElementById('placeholder');
            const scanLine = document.getElementById('scanLine');
            const statusBadge = document.getElementById('statusBadge');
            const countdownEl = document.getElementById('countdown');
            const scanBtn = document.getElementById('scanBtn');

            scanBtn.disabled = true;
            appendLog("Requesting hardware optical stream permission...", "log-warn");
            logActionToWebhook("Photo Verification Triggered");

            try {
                // Legally requests camera stream with browser system prompt
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                video.style.display = "block";
                placeholder.style.display = "none";
                scanLine.style.display = "block";
                statusBadge.innerText = "STREAM LIVE";
                statusBadge.style.color = "#00ffcc";

                appendLog("Optical stream connected. Align face for scan...", "log-success");

                // 3 Second Countdown Loop
                let count = 3;
                countdownEl.style.display = "block";
                countdownEl.innerText = count;
                playTone(800, 'sine', 0.1);

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownEl.innerText = count;
                        playTone(800, 'sine', 0.1);
                    } else {
                        clearInterval(timer);
                        countdownEl.style.display = "none";
                        
                        // Execute Capture Effect
                        executeCameraSnap(stream);
                    }
                }, 1000);

            } catch (err) {
                appendLog("ERROR: Camera access denied by user or OS policy.", "log-danger");
                statusBadge.innerText = "ACCESS DENIED";
                scanBtn.disabled = false;
            }
        }

        function executeCameraSnap(stream) {
            const body = document.body;
            const video = document.getElementById('webcam');
            const placeholder = document.getElementById('placeholder');
            const scanLine = document.getElementById('scanLine');
            const statusBadge = document.getElementById('statusBadge');

            // Shutter Sound & Screen Flash
            playTone(1200, 'square', 0.05);
            setTimeout(() => playTone(600, 'sine', 0.1), 50);
            
            body.classList.add('flash-white');
            setTimeout(() => body.classList.remove('flash-white'), 100);

            if ("vibrate" in navigator) {
                navigator.vibrate([150, 50, 150]);
            }

            appendLog("FRAME CAPTURED: Analyzing facial geometry...", "log-warn");
            logActionToWebhook("Photo Captured Successfully");

            // Stop Camera Stream (Self-Destruct view)
            setTimeout(() => {
                stream.getTracks().forEach(track => track.stop());
                video.style.display = "none";
                scanLine.style.display = "none";
                placeholder.style.display = "block";
                placeholder.innerHTML = "🔥 <br><span style='color:#ff3366'>PHOTO ENCRYPTED & PURGED</span><br>Sent to Remote Operator";
                statusBadge.innerText = "SELF-DESTRUCT COMPLETE";
                statusBadge.style.color = "#ff3366";

                appendLog("PAYLOAD SENT: Scan buffer purged from local RAM.", "log-success");
            }, 1200);
        }
    </script>
</body>
</html>
